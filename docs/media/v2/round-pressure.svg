<circle cx="470.86361" cy="123" r="7" fill="#267567"/>
<text x="630" y="131" fill="#267567" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">6.7833 bar</text>
<text x="23" y="196" fill="#192a2a" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PG-13</text>
