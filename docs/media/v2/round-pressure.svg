<line x1="188" y1="58" x2="362.69381" y2="58" stroke="#267567" stroke-width="8" stroke-dasharray="none"/>
<circle cx="362.69381" cy="58" r="7" fill="#267567"/>
<text x="630" y="66" fill="#267567" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">4.1893 bar</text>
<text x="23" y="131" fill="#192a2a" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PG-12</text>
<line x1="188" y1="123" x2="605" y2="123" stroke="#cfdbd5" stroke-width="8" stroke-dasharray="none"/>
