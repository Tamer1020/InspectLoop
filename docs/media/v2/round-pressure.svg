<line x1="521.6" y1="236" x2="521.6" y2="269" stroke="#192a2a" stroke-width="2" stroke-dasharray="none"/>
<text x="516.6" y="230" fill="#192a2a" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">8.0 limit</text>
