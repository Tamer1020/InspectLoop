<text x="630" y="196" fill="#475b57" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Unresolved</text>
<text x="23" y="261" fill="#192a2a" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PG-14</text>
<line x1="188" y1="253" x2="605" y2="253" stroke="#cfdbd5" stroke-width="8" stroke-dasharray="none"/>
