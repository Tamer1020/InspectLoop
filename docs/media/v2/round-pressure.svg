<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 335" role="img" aria-labelledby="title desc">
<title id="title">Pressure readings from the filmed round</title><desc id="desc">Three accepted pressures on a zero to ten bar scale. PG-13 has no accepted value. PG-14 exceeded its eight bar alarm threshold.</desc>
<rect width="840" height="335" rx="14" fill="#f2f4ef"/>
