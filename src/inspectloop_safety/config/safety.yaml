cmd_vel_gate:
  ros__parameters:
    use_sim_time: true
    max_linear: 0.45            # m/s  (Nav2 limit 0.40 + margin)
    max_angular: 1.3            # rad/s
    cmd_timeout_s: 0.5          # deadman
    scan_timeout_s: 0.5         # steady (wall) time since the last scan; 10 Hz LiDAR -> 5 missed scans
    scan_max_stamp_age_s: 1.0   # header stamp older than this (ROS time) -> scan rejected
    scan_max_future_s: 0.2      # header stamp ahead of the ROS clock by more -> rejected
    scan_min_usable_fraction: 0.5   # usable beams (finite in range, +inf, -inf) overall and forward
    # cmd_timeout_s is measured on the steady clock (deadman)
    stop_distance_m: 0.20       # free distance ahead of the front edge
    slow_distance_m: 0.45
    corridor_half_width_m: 0.27 # half robot width incl. wheels + 2 cm
    lidar_to_front_m: 0.15      # lidar at x=0.10, front edge at x=0.25
    lidar_to_rear_m: 0.35       # rear edge at x=-0.25 (Nav2 MPPI may reverse: vx_min -0.2)
    lidar_x_m: 0.10             # lidar position in base_link (rotation centre at x=0)
    # --- V3 motion-sector coverage (Astra V2 review F3) -----------------------------------
    # A direction may only be driven if the sector its corridor occupies is OBSERVED: a beam
    # observes its ray if finite in [range_min, range_max] or +/-inf (REP-117). NaN,
    # out-of-range values and unsampled directions are unknown, never free space.
    forward_sector_half_angle_deg: 0.0   # 0 = from geometry: atan2(0.27, 0.15) = 60.9 deg
    rear_sector_half_angle_deg: 0.0      # 0 = from geometry: atan2(0.27, 0.35) = 37.6 deg
    sector_min_coverage: 0.95            # observed fraction of the sector's sample directions
    sector_max_gap_deg: 2.0              # widest tolerated contiguous unobserved wedge
    scan_max_angle_increment_deg: 1.0    # coarser scans cannot protect the corridor at all
    rotation_radius_m: 0.35              # footprint corner radius: obstacles inside block turning
    publish_rate_hz: 20.0

health_monitor:
  ros__parameters:
    use_sim_time: true
    topics: ["/scan", "/odom", "/camera/image_raw", "/camera/camera_info", "/joint_states"]
    types: ["sensor_msgs/msg/LaserScan", "nav_msgs/msg/Odometry", "sensor_msgs/msg/Image",
            "sensor_msgs/msg/CameraInfo", "sensor_msgs/msg/JointState"]
    timeouts_s: [0.5, 0.5, 1.0, 1.0, 1.0]
    min_rates_hz: [7.0, 20.0, 5.0, 5.0, 10.0]
    tf_checks: ["map:odom", "odom:base_footprint", "base_link:lidar_link",
                "base_link:camera_optical_link"]
    tf_max_age_s: 1.5
    startup_grace_s: 10.0
    publish_period_s: 1.0
